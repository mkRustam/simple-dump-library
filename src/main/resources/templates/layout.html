<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <title layout:title-pattern="$CONTENT_TITLE - Library">Library</title>
</head>
<body>

<nav class="navbar" sec:authorize="isAuthenticated()">
  <a th:href="@{/library}" class="navbar-brand">Library</a>
  <div class="navbar-links">
    <a th:href="@{/library}">Books</a>
    <a th:href="@{/person}">My Books</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
    </form>
  </div>
</nav>

<div class="page-wrapper" layout:fragment="content">
</div>

</body>
</html>
