<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>My Books</title>
</head>
<body>
<div layout:fragment="content">

  <h1>My Books</h1>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
      <td th:text="${book.id}"></td>
      <td><a th:href="@{'/library/book/' + ${book.id}}" th:text="${book.title}"></a></td>
      <td>
        <form th:action="@{'/person/unhold/' + ${book.id}}" method="post" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-secondary btn-sm">Return</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div style="margin-top:1.5rem">
    <a th:href="@{/library}" class="btn btn-primary">Go to library</a>
  </div>

</div>
</body>
</html>
