<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Person Page</title>
    <link rel="stylesheet" th:href="@{/css/private/person-page-style.css}" />
</head>
<body>

<h2>Book List</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td>
            <form th:action="@{'/person/unhold/' + ${book.id}}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="action-button">Return</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a href="/library" class="action-button">Go to library</a>

<form action="/logout" method="post" class="logout-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="submit" value="Logout" />
</form>

</body>
</html>
