<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
    <link rel="stylesheet" th:href="@{/css/private/library/books/list-page-style.css}" />
</head>
<body>

<a href="javascript:history.back()" class="back-link">← Go Back</a>

<h2>Book List</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td>
            <form th:action="@{'/library/hold/' + ${book.id}}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="action-button">Take</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
