<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title th:text="${book.title}">Book Details</title>
</head>
<body>
<div layout:fragment="content">

  <a th:href="@{/library}" class="back-link">&larr; Library</a>

  <div class="book-detail card">
    <h1 th:text="${book.title}">Book Title</h1>

    <div class="average-rating">
      <span class="rating-label">Rating:</span>
      <span th:if="${book.averageRating != null}" class="stars">
        <span th:each="i : ${#numbers.sequence(1, 5)}"
              th:classappend="${i <= book.averageRating} ? 'star filled' : 'star'">&#9733;</span>
        <span class="rating-value" th:text="${#numbers.formatDecimal(book.averageRating, 1, 1)}"></span>
      </span>
      <span th:if="${book.averageRating == null}" class="no-rating">No ratings yet</span>
    </div>

    <div class="book-detail-status">
      <span th:if="${book.holderId == null}" class="badge badge-available">Available</span>
      <span th:if="${book.holderId != null}" class="badge badge-unavailable">
        Checked out by <span th:text="${book.holderName}"></span>
      </span>
    </div>

    <div class="book-detail-actions">
      <form th:if="${book.holderId == null}"
            th:action="@{'/library/hold/' + ${book.id}}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-primary">Take this book</button>
      </form>

      <form th:if="${book.holderId == currentPersonId}"
            th:action="@{'/person/unhold/' + ${book.id}}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-secondary">Return this book</button>
      </form>

      <a th:href="@{'/library/book/' + ${book.id} + '/reviews'}" class="btn btn-secondary">Reviews</a>
    </div>
  </div>

</div>
</body>
</html>
