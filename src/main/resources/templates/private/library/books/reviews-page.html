<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Book Reviews</title>
    <link rel="stylesheet" th:href="@{/css/private/library/books/reviews-page-style.css}" />
</head>
<body>

<a th:href="@{/library}" class="back-link">← Back to Library</a>

<h2>Reviews</h2>

<div class="average-rating" th:if="${averageRating != null}">
    <span class="rating-label">Average Rating:</span>
    <span class="stars">
        <span th:each="i : ${#numbers.sequence(1, 5)}"
              th:classappend="${i <= averageRating} ? 'star filled' : 'star'">★</span>
    </span>
    <span class="rating-value" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}"></span>
</div>
<div class="average-rating" th:if="${averageRating == null}">
    <span class="rating-label">No ratings yet</span>
</div>

<!-- Error message -->
<div th:if="${error}" class="error-message" th:text="${error}"></div>

<!-- Review form -->
<div class="review-form" sec:authorize="hasAuthority('REVIEW_CREATE')">
    <h3>Leave a Review</h3>
    <form th:action="@{'/library/book/' + ${bookId} + '/reviews'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="text">Your Review:</label>
            <textarea id="text" name="text" rows="4" maxlength="1000" required
                      placeholder="Share your thoughts about this book..."></textarea>
        </div>
        <button type="submit" class="submit-button">Submit Review</button>
    </form>
</div>

<!-- Reviews list -->
<div class="reviews-list">
    <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
        <p>No reviews yet. Be the first to review this book!</p>
    </div>

    <div th:each="review : ${reviews}" class="review-card">
        <div class="review-header">
            <span class="review-author" th:text="${review.authorName}"></span>
            <span class="review-stars">
                <span th:each="i : ${#numbers.sequence(1, 5)}"
                      th:classappend="${i <= review.rating} ? 'star filled' : 'star'">★</span>
            </span>
            <span class="review-date" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
        </div>
        <div class="review-text" th:text="${review.text}"></div>
        <div class="review-actions">
            <!-- Delete own review -->
            <form th:if="${review.authorId == currentPersonId}"
                  th:action="@{'/library/book/' + ${bookId} + '/reviews/' + ${review.id} + '/delete'}"
                  method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="delete-button">Delete</button>
            </form>
            <!-- Moderator delete -->
            <form th:if="${review.authorId != currentPersonId}"
                  sec:authorize="hasAuthority('REVIEW_MANAGE')"
                  th:action="@{'/library/book/' + ${bookId} + '/reviews/' + ${review.id} + '/delete'}"
                  method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="delete-button moderator">Remove (Mod)</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
