<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Reviews</title>
</head>
<body>
<div layout:fragment="content">

  <a th:href="@{/library}" class="back-link">&larr; Library</a>

  <h1>Reviews</h1>

  <div class="average-rating" th:if="${averageRating != null}">
    <span class="rating-label">Average Rating:</span>
    <span class="stars">
      <span th:each="i : ${#numbers.sequence(1, 5)}"
            th:classappend="${i <= averageRating} ? 'star filled' : 'star'">&#9733;</span>
    </span>
    <span class="rating-value" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}"></span>
  </div>
  <div class="average-rating" th:if="${averageRating == null}">
    <span class="rating-label">No ratings yet</span>
  </div>

  <div th:if="${error}" class="alert-error" th:text="${error}"></div>

  <div class="review-form card" sec:authorize="hasAuthority('REVIEW_CREATE')">
    <h3>Leave a Review</h3>
    <form th:action="@{'/library/book/' + ${bookId} + '/reviews'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label for="rating">Rating:</label>
        <select id="rating" name="rating" required>
          <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; (5)</option>
          <option value="4">&#9733;&#9733;&#9733;&#9733;&#9734; (4)</option>
          <option value="3">&#9733;&#9733;&#9733;&#9734;&#9734; (3)</option>
          <option value="2">&#9733;&#9733;&#9734;&#9734;&#9734; (2)</option>
          <option value="1">&#9733;&#9734;&#9734;&#9734;&#9734; (1)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="text">Your Review:</label>
        <textarea id="text" name="text" rows="4" maxlength="1000" required
                  placeholder="Share your thoughts about this book..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
  </div>

  <div class="reviews-list">
    <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
      <p>No reviews yet. Be the first to review this book!</p>
    </div>

    <div th:each="review : ${reviews}" class="review-card">
      <div class="review-header">
        <span class="review-author" th:text="${review.authorName}"></span>
        <span class="review-stars">
          <span th:each="i : ${#numbers.sequence(1, 5)}"
                th:classappend="${i <= review.rating} ? 'star filled' : 'star'">&#9733;</span>
        </span>
        <span class="review-date" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
      </div>
      <div class="review-text" th:text="${review.text}"></div>
      <div class="review-actions">
        <form th:if="${review.authorId == currentPersonId}"
              th:action="@{'/library/book/' + ${bookId} + '/reviews/' + ${review.id} + '/delete'}"
              method="post" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
        <form th:if="${review.authorId != currentPersonId}"
              sec:authorize="hasAuthority('REVIEW_MANAGE')"
              th:action="@{'/library/book/' + ${bookId} + '/reviews/' + ${review.id} + '/delete'}"
              method="post" style="display:inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger btn-sm">Remove (Mod)</button>
        </form>
      </div>
    </div>
  </div>

</div>
</body>
</html>
