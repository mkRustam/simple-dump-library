spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_app_security_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    hikari:
      schema: spring_app_security_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS spring_app_security_schema
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
app:
  security:
    storage-type: database
logging:
  level:
    org:
      springframework:
        security: INFO
